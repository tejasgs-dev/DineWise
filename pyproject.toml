[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dinewise"
version = "0.1.0"
description = "AI-powered restaurant recommendations from the Zomato dataset, ranked and explained by an LLM on Groq."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "huggingface_hub>=0.23",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "groq>=1.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The legacy Streamlit UI; the API and the web frontend don't need it.
ui = ["streamlit>=1.36"]
dev = [
    "streamlit>=1.36",  # tests/unit/test_ui.py
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyyaml>=6.0",  # eval scenarios (tests/eval)
]

[tool.hatch.build.targets.wheel]
packages = ["src/dinewise"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Design docs contain illustrative code snippets; don't lint or reformat them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["dinewise"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# The LLM eval suite (tests/eval) calls the real API and costs money, so it is
# not collected by default. Run it explicitly: python -m tests.eval.run_eval
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-markers"
markers = [
    "eval: calls the real Claude API (costs money; never run in CI)",
]

[tool.coverage.run]
source = ["dinewise"]
branch = true
